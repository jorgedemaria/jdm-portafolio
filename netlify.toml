# Configuración de Netlify: se lee sola al conectar el repositorio.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Vue Router usa direcciones como /proyectos/casa-ejemplo: todas cargan index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Archivos con nombre único en cada publicación: se pueden guardar en caché para siempre
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Fotos: una semana (si reemplazas una foto con el mismo nombre, se actualiza en días)
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
